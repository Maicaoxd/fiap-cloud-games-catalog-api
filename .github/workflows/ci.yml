name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    name: Compilar e testar
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Executar testes
        run: dotnet test tests/CatalogAPI.Tests/CatalogAPI.Tests.csproj --configuration Release --logger "trx;LogFileName=tests.trx" --results-directory .artifacts/tests
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-catalog
          path: .artifacts/tests/*.trx
          retention-days: 3
          if-no-files-found: warn
