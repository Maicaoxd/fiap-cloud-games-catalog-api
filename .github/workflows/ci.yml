name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: Tag de versão opcional, por exemplo v1.2.3
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    uses: Maicaoxd/fiap-cloud-games-orchestration/.github/workflows/service-build.yml@master
    with:
      service: catalog-api
      project: CatalogAPI
      source_ref: ${{ github.sha }}
      publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
      version: ${{ inputs.version || '' }}

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    permissions:
      contents: read
      id-token: write
    uses: Maicaoxd/fiap-cloud-games-orchestration/.github/workflows/service-deploy.yml@master
    with:
      service: catalog-api
      digest: ${{ needs.build.outputs.digest }}
